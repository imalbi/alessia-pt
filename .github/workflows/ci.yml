name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node runs `yarn cache dir` itself, so Corepack has to be on before
      # it, or the runner's Yarn 1 rejects the packageManager field.
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Unit + integration tests
        run: yarn test

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: E2E tests
        run: yarn test:e2e --project=chromium

      - name: Build
        run: yarn build
